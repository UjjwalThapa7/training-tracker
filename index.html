<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Training Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #17181a;
    --surface: #202225;
    --surface-2: #26282c;
    --line: #34363b;
    --chalk: #edede6;
    --chalk-dim: #a6a8ad;
    --iron: #b5382b;
    --iron-dim: #7d2a21;
    --brass: #c99a3c;
    --recover: #3e7068;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #17181a;
      --surface: #202225;
      --surface-2: #26282c;
      --line: #34363b;
      --chalk: #edede6;
      --chalk-dim: #a6a8ad;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  .masthead {
    padding: 18px 2px 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .masthead .kicker {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--chalk-dim);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  .masthead h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--chalk);
  }
  .masthead h1 span { color: var(--iron); }

  /* day rail */
  .rail {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 14px;
    margin-bottom: 4px;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 10px 14px 9px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
    min-width: 78px;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .day-btn .d { display:block; font-size: 13.5px; }
  .day-btn .t { display:block; font-family:'Inter',sans-serif; font-weight:400; font-size: 10.5px; margin-top:3px; color: var(--chalk-dim); text-transform: none; letter-spacing: 0; }
  .day-btn.active {
    color: var(--chalk);
    border-color: var(--iron);
    background: linear-gradient(180deg, rgba(181,56,43,0.16), rgba(181,56,43,0.05));
  }
  .day-btn.active .t { color: var(--iron); }
  .day-btn.rest.active {
    border-color: var(--recover);
    background: linear-gradient(180deg, rgba(62,112,104,0.18), rgba(62,112,104,0.05));
  }
  .day-btn.rest.active .t { color: var(--recover); }

  .panel { display: none; }
  .panel.show { display: block; animation: fade 0.22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 6px 2px 14px;
  }
  .panel-head h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    color: var(--chalk);
  }
  .panel-head .focus-tag {
    font-size: 12px;
    color: var(--iron);
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .panel-head .focus-tag.rest { color: var(--recover); }

  .rest-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--recover);
    border-radius: 4px;
    padding: 28px 20px;
    text-align: center;
  }
  .rest-card .big { font-family:'Oswald',sans-serif; font-size: 20px; color: var(--recover); margin-bottom: 6px; }
  .rest-card p { color: var(--chalk-dim); margin: 0; font-size: 14px; line-height: 1.6; }

  .tempo-note {
    background: rgba(201,154,60,0.08);
    border: 1px solid rgba(201,154,60,0.35);
    border-radius: 4px;
    padding: 11px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--brass);
    line-height: 1.5;
  }
  .tempo-note b { color: var(--brass); }

  .ex-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .ex {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ex.done { opacity: 0.45; }
  .ex .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ex .idx {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    color: var(--chalk-dim);
    width: 20px;
    flex: 0 0 auto;
  }
  .ex .name {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--chalk);
    line-height: 1.3;
  }
  .ex .scheme {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 2px;
  }
  .check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex: 0 0 auto;
    cursor: pointer;
    background: transparent;
    position: relative;
  }
  .check.on { border-color: var(--iron); background: var(--iron); }
  .check.on::after {
    content: '';
    position: absolute; left: 7px; top: 3px;
    width: 5px; height: 10px;
    border-right: 2px solid var(--chalk);
    border-bottom: 2px solid var(--chalk);
    transform: rotate(45deg);
  }

  .abs-block, .cardio-block {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .abs-block .tag, .cardio-block .tag {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--brass);
    flex: 0 0 auto;
    border-right: 1px solid var(--line);
    padding-right: 12px;
  }
  .abs-block p, .cardio-block p { margin: 0; font-size: 13px; color: var(--chalk-dim); }

  .progress-foot {
    margin-top: 18px;
    font-size: 12px;
    color: var(--chalk-dim);
    text-align: right;
  }
  .progress-foot button {
    background: none; border: none; color: var(--chalk-dim);
    text-decoration: underline; cursor: pointer; font-size: 12px;
    padding: 0; margin-left: 10px;
  }

  /* top-level section nav */
  .sect-nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    margin-bottom: 4px;
    scrollbar-width: none;
  }
  .sect-nav::-webkit-scrollbar { display: none; }
  .sect-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--chalk-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 8px 10px;
    cursor: pointer;
  }
  .sect-btn.active { color: var(--chalk); border-bottom-color: var(--iron); }
  .sect-panel { display: none; }
  .sect-panel.show { display: block; animation: fade 0.22s ease; }

  /* generic module card */
  .mod-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .mod-card h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--chalk);
  }
  .mod-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .mod-row input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    min-width: 0;
  }
  .mod-row button {
    flex: 0 0 auto;
    background: var(--iron);
    color: var(--chalk);
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .mod-row button.ghost {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
  }
  .quick-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick-row button {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 8px 14px;
    border-radius: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .big-stat {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    color: var(--brass);
    margin-bottom: 2px;
  }
  .stat-label { font-size: 12px; color: var(--chalk-dim); margin-bottom: 14px; }
  .mini-list { display: flex; flex-direction: column; gap: 6px; }
  .mini-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: var(--surface-2);
    border-radius: 4px;
    font-size: 13.5px;
  }
  .mini-row .l { color: var(--chalk); }
  .mini-row .r { color: var(--chalk-dim); font-size: 12px; }
  .mini-row .del {
    background: none; border: none; color: var(--chalk-dim);
    cursor: pointer; font-size: 12px; margin-left: 8px;
  }
  .pr-grid { display: flex; flex-direction: column; gap: 8px; }
  .pr-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); border-radius: 4px; padding: 10px 12px;
  }
  .pr-item .name { font-size: 14px; color: var(--chalk); }
  .pr-item .val { font-family: 'Oswald', sans-serif; color: var(--brass); font-size: 16px; }
  .pr-item input { width: 70px; text-align: center; }
  .empty-hint { color: var(--chalk-dim); font-size: 12.5px; text-align: center; padding: 10px 0; }

  /* auth */
  #authScreen {
    max-width: 380px;
    margin: 18vh auto 0;
    padding: 0 20px;
    text-align: center;
  }
  #authScreen h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    margin: 0 0 6px;
  }
  #authScreen p { color: var(--chalk-dim); font-size: 13.5px; margin: 0 0 20px; }
  #authScreen input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--chalk);
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: 'Inter', sans-serif;
  }
  #authScreen input:focus { outline: none; border-color: var(--iron); }
  #authScreen button {
    width: 100%;
    background: var(--iron);
    color: var(--chalk);
    border: none;
    padding: 12px 14px;
    border-radius: 4px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  #authScreen button:disabled { opacity: 0.5; cursor: default; }
  #codeRow input {
    text-align: center;
    letter-spacing: 0.3em;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
  }
  #authMsg { margin-top: 12px; font-size: 12.5px; color: var(--recover); min-height: 16px; }
  #authMsg.err { color: var(--iron); }

  #appShell { display: none; }
  #signOutBar {
    display: flex; justify-content: flex-end; margin-bottom: 4px;
  }
  #signOutBar button {
    background: none; border: none; color: var(--chalk-dim);
    font-size: 12px; text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<div id="authScreen">
  <h1>Push, pull, <span style="color:var(--iron)">repeat.</span></h1>
  <p>Sign in with your email to save your progress. No password &mdash; we'll send a 6-digit code.</p>
  <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
  <button id="sendLinkBtn">Send code</button>
  <div id="codeRow" style="display:none; margin-top:14px;">
    <input type="text" id="codeInput" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button id="verifyBtn">Verify &amp; sign in</button>
  </div>
  <div id="authMsg"></div>
</div>

<div id="appShell">
<div class="wrap">

  <div id="signOutBar"><button id="signOutBtn">Sign out</button></div>

  <div class="masthead">
    <p class="kicker">7-day split &middot; strength + hypertrophy</p>
    <h1>Push, pull, <span>repeat.</span></h1>
  </div>

  <div class="sect-nav" id="sectNav">
    <button class="sect-btn active" data-sect="training">Training</button>
    <button class="sect-btn" data-sect="weight">Weight</button>
    <button class="sect-btn" data-sect="water">Water</button>
    <button class="sect-btn" data-sect="prs">PRs</button>
    <button class="sect-btn" data-sect="food">Food</button>
  </div>

  <div class="sect-panel show" id="sect-training">
    <div class="rail" id="rail"></div>
    <div id="panels"></div>
    <div class="progress-foot" id="progFoot"></div>
  </div>

  <div class="sect-panel" id="sect-weight">
    <div class="mod-card">
      <h3>Log today's weight</h3>
      <div class="mod-row">
        <input type="number" step="0.1" id="weightInput" placeholder="e.g. 72.5">
        <button id="weightAddBtn">Log</button>
      </div>
    </div>
    <div class="mod-card">
      <h3>Recent entries</h3>
      <div class="mini-list" id="weightList"></div>
    </div>
  </div>

  <div class="sect-panel" id="sect-water">
    <div class="mod-card">
      <div class="big-stat" id="waterTotal">0 ml</div>
      <div class="stat-label">logged today</div>
      <div class="quick-row">
        <button data-ml="250">+250ml</button>
        <button data-ml="500">+500ml</button>
        <button data-ml="1000">+1L</button>
      </div>
      <div class="mod-row">
        <input type="number" id="waterCustomInput" placeholder="custom ml">
        <button id="waterCustomBtn">Add</button>
      </div>
    </div>
    <div class="mod-card">
      <h3>Today's log</h3>
      <div class="mini-list" id="waterList"></div>
    </div>
  </div>

  <div class="sect-panel" id="sect-prs">
    <div class="mod-card">
      <h3>Current PRs</h3>
      <div class="pr-grid" id="prGrid"></div>
    </div>
  </div>

  <div class="sect-panel" id="sect-food">
    <div class="mod-card">
      <div class="big-stat" id="foodTotal">0 kcal</div>
      <div class="stat-label">logged today</div>
      <div class="mod-row">
        <input type="text" id="foodNameInput" placeholder="meal / food">
        <input type="number" id="foodCalInput" placeholder="kcal" style="max-width:90px;">
      </div>
      <div class="mod-row">
        <button id="foodAddBtn" style="flex:1;">Add entry</button>
      </div>
    </div>
    <div class="mod-card">
      <h3>Today's log</h3>
      <div class="mini-list" id="foodList"></div>
    </div>
  </div>

</div>
</div>

<script>
const DATA = [
  {
    key: 'sun', day: 'Sunday', tag: 'Compound', type: 'train',
    exercises: [
      { name: 'Squats', scheme: '5 sets, climbing to your max working weight' },
      { name: 'Bench press', scheme: '5 × 10 @ 50% of your PR' },
      { name: 'Barbell row', scheme: '5 × 10, same weight across all sets' },
      { name: 'Shoulder press', scheme: '5 × 10, same weight across all sets' },
    ],
  },
  {
    key: 'mon', day: 'Monday', tag: 'Chest · Shoulders · Triceps', type: 'train',
    tempo: true, abs: true,
    exercises: [
      { name: 'Incline dumbbell press', scheme: 'Controlled negative, moderate load' },
      { name: 'Decline barbell press + weighted dips', scheme: 'Superset' },
      { name: 'Machine pec deck fly', scheme: 'Slow eccentric' },
      { name: 'Lateral raises', scheme: 'Slow eccentric' },
      { name: 'Reverse pec deck fly', scheme: 'Slow eccentric' },
      { name: 'Skull crushers', scheme: 'Controlled negative' },
      { name: 'Triceps pushdown + diamond push-ups', scheme: 'Superset' },

    ],
  },
  {

    exercises: [
      { name: 'Bench press', scheme: '5 sets, climbing to your max working weight' },
      { name: 'Barbell row', scheme: '5 × 10, same weight across all sets' },
      { name: 'Shoulder press', scheme: '5 × 10, same weight across all sets' },
      { name: 'Deadlift', scheme: '5 × 10 @ 50% of your PR' },
    ],
  },
  {
    key: 'wed', day: 'Wednesday', tag: 'Rest', type: 'rest',
  },
  {
    key: 'thu', day: 'Thursday', tag: 'Legs · Biceps', type: 'train',
    tempo: true, abs: true,
    exercises: [
      { name: 'Lunges', scheme: 'Controlled negative, moderate load' },
      { name: 'Seated leg curls', scheme: 'Slow eccentric' },
      { name: 'Romanian deadlift', scheme: 'Controlled negative' },
      { name: 'Standing calf raises', scheme: 'Slow eccentric' },
      { name: 'Preacher curls', scheme: 'Slow eccentric' },
      { name: 'Incline biceps curls', scheme: 'Slow eccentric' },
      { name: 'Hammer curls', scheme: 'Slow eccentric' },
      { name: 'Forearms', scheme: 'Controlled negative' },
    ],
  },
  {

      { name: 'Deadlift', scheme: '5 sets, climbing to your max working weight' },
      { name: 'Shoulder press', scheme: '5 × 10, same weight across all sets' },
      { name: 'Bench press', scheme: '5 × 10 @ 50% of your PR' },
      { name: 'Squats', scheme: '5 × 10 @ 50% of your PR' },
    ],
  },
  {
    key: 'sat', day: 'Saturday', tag: 'Rest', type: 'rest',
  },
];

const SUPABASE_URL = 'https://gbwrjzonumtmmwroawkm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_S-N7m0j6vXb7w2GaOk7k1A_uqVUT7Ox';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let checks = {};
let currentUser = null;

async function loadChecksFromDb() {
  const { data, error } = await sb.from('training_checks').select('exercise_key, done');
  if (error) { console.error(error); return; }
  checks = {};
  (data || []).forEach(row => { if (row.done) checks[row.exercise_key] = true; });
}

async function setCheckInDb(key, value) {
  if (value) {
    await sb.from('training_checks').upsert(
      { user_id: currentUser.id, exercise_key: key, done: true, updated_at: new Date().toISOString() },
      { onConflict: 'user_id,exercise_key' }
    );
  } else {
    await sb.from('training_checks').delete().eq('user_id', currentUser.id).eq('exercise_key', key);
  }
}

function saveChecks() { /* writes now happen per-toggle via setCheckInDb */ }

const rail = document.getElementById('rail');
const panels = document.getElementById('panels');
const progFoot = document.getElementById('progFoot');

function buildUI() {
rail.innerHTML = '';
panels.innerHTML = '';
DATA.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'day-btn' + (d.type === 'rest' ? ' rest' : '');
  btn.dataset.key = d.key;
  btn.innerHTML = `<span class="d">${d.day}</span><span class="t">${d.tag}</span>`;
  btn.addEventListener('click', () => selectDay(d.key));
  rail.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + d.key;

  if (d.type === 'rest') {
    panel.innerHTML = `
      <div class="panel-head">
        <h2>${d.day}</h2>
        <span class="focus-tag rest">Rest day</span>
      </div>
      <div class="rest-card">
        <div class="big">Off the floor.</div>
        <p>No lifting today. Sleep, hydrate, and let the last two sessions settle in.</p>
      </div>
    `;
  } else {
    let html = `
      <div class="panel-head">
        <h2>${d.day}</h2>
        <span class="focus-tag">${d.tag}</span>
      </div>
    `;
    if (d.tempo) {
      html += `<div class="tempo-note"><b>Focus:</b> negative-phase tension over heavy loading &mdash; slow the lowering, keep the weight moderate.</div>`;
    }
    html += `<div class="ex-list">`;
    d.exercises.forEach((ex, i) => {
      const ckKey = d.key + '-' + i;
      const on = checks[ckKey] ? ' done' : '';
      const checkOn = checks[ckKey] ? ' on' : '';
      html += `
        <div class="ex${on}" data-key="${ckKey}">
          <div class="left">
            <span class="idx">${String(i + 1).padStart(2, '0')}</span>
            <div>
              <div class="name">${ex.name}</div>
              <div class="scheme">${ex.scheme}</div>
            </div>
          </div>
          <button class="check${checkOn}" data-key="${ckKey}"></button>
        </div>
      `;
    });
    html += `</div>`;

    if (d.abs) {
      html += `
        <div class="abs-block">
          <span class="tag">ABS</span>
          <p>3 sets of hanging leg raises &middot; 3 sets of sit-ups</p>
        </div>
      `;
    }
    html += `
      <div class="cardio-block">
        <span class="tag">FINISH</span>
        <p>10 min jog or incline treadmill walk to close out the session</p>
      </div>
    `;
    panel.innerHTML = html;
  }

  panels.appendChild(panel);
});

document.querySelectorAll('.check').forEach(btn => {
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const key = btn.dataset.key;
    const newVal = !checks[key];
    checks[key] = newVal;
    btn.classList.toggle('on', newVal);
    const row = document.querySelector('.ex[data-key="' + key + '"]');
    if (row) row.classList.toggle('done', newVal);
    updateProgress();
    try { await setCheckInDb(key, newVal); }
    catch (err) { console.error('sync failed', err); }
  });
});

// default to today if it's in the split, else Sunday
const jsDayIdx = new Date().getDay(); // 0 = Sunday
const order = ['sun','mon','tue','wed','thu','fri','sat'];
selectDay(order[jsDayIdx]);
} // end buildUI

function updateProgress() {
  const activeKey = document.querySelector('.day-btn.active')?.dataset.key;
  const d = DATA.find(x => x.key === activeKey);
  if (!d || d.type === 'rest') { progFoot.innerHTML = ''; return; }
  const total = d.exercises.length;
  const done = d.exercises.filter((_, i) => checks[d.key + '-' + i]).length;
  progFoot.innerHTML = `${done} / ${total} logged <button id="resetBtn">reset day</button>`;
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      d.exercises.forEach((_, i) => { delete checks[d.key + '-' + i]; });
      saveChecks();
      selectDay(d.key);
    });
  }
}

function selectDay(key) {
  document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === 'panel-' + key));
  updateProgress();
  const activeBtn = document.querySelector('.day-btn[data-key="' + key + '"]');
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* ---------- auth wiring ---------- */
const authScreen = document.getElementById('authScreen');
const appShell = document.getElementById('appShell');
const emailInput = document.getElementById('emailInput');
const sendLinkBtn = document.getElementById('sendLinkBtn');
const codeRow = document.getElementById('codeRow');
const codeInput = document.getElementById('codeInput');
const verifyBtn = document.getElementById('verifyBtn');
const authMsg = document.getElementById('authMsg');
const signOutBtn = document.getElementById('signOutBtn');

sendLinkBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  if (!email) return;
  sendLinkBtn.disabled = true;
  authMsg.className = '';
  authMsg.textContent = 'Sending...';
  try {
    // No emailRedirectTo: this sends a 6-digit code instead of a clickable
    // link, which avoids corporate email link-scanners burning the token
    // before the user opens it.
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: true }
    });
    if (error) throw error;
    authMsg.className = '';
    authMsg.textContent = 'Enter the 6-digit code we emailed you.';
    codeRow.style.display = 'block';
    codeInput.focus();
  } catch (err) {
    authMsg.className = 'err';
    authMsg.textContent = err.message || 'Could not send code. Try again.';
  } finally {
    sendLinkBtn.disabled = false;
  }
});

verifyBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  const token = codeInput.value.trim();
  if (!email || !token) return;
  verifyBtn.disabled = true;
  authMsg.className = '';
  authMsg.textContent = 'Verifying...';
  try {
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) throw error;
    // onAuthStateChange picks up the new session and shows the app
  } catch (err) {
    authMsg.className = 'err';
    authMsg.textContent = err.message || 'Invalid or expired code. Try again.';
  } finally {
    verifyBtn.disabled = false;
  }
});

signOutBtn.addEventListener('click', async () => {
  await sb.auth.signOut();
});

async function showApp(user) {
  currentUser = user;
  authScreen.style.display = 'none';
  appShell.style.display = 'block';
  await loadChecksFromDb();
  buildUI();
  initSectionNav();
  loadWeight();
  loadWater();
  loadPRs();
  loadFood();
}

function showAuth() {
  currentUser = null;
  appShell.style.display = 'none';
  authScreen.style.display = 'block';
  authMsg.textContent = '';
  authMsg.className = '';
}

sb.auth.onAuthStateChange((event, session) => {
  if (session && session.user) showApp(session.user);
  else showAuth();
});

sb.auth.getSession().then(({ data }) => {
  if (data.session && data.session.user) showApp(data.session.user);
  else showAuth();
});

/* ---------- section nav ---------- */
function initSectionNav() {
  document.querySelectorAll('.sect-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.sect-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.sect-panel').forEach(p => p.classList.toggle('show', p.id === 'sect-' + btn.dataset.sect));
    };
  });
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------- weight ---------- */
async function loadWeight() {
  const { data, error } = await sb.from('body_weight_logs')
    .select('id, logged_at, weight, unit')
    .order('logged_at', { ascending: false })
    .limit(10);
  const list = document.getElementById('weightList');
  if (error) { list.innerHTML = '<div class="empty-hint">Could not load entries.</div>'; return; }
  if (!data || !data.length) { list.innerHTML = '<div class="empty-hint">No entries yet.</div>'; return; }
  list.innerHTML = data.map(row => `
    <div class="mini-row">
      <span class="l">${row.weight} ${row.unit}</span>
      <span class="r">${row.logged_at}<button class="del" data-table="body_weight_logs" data-id="${row.id}">remove</button></span>
    </div>
  `).join('');
  attachDelHandlers(list, loadWeight);
}

document.getElementById('weightAddBtn').addEventListener('click', async () => {
  const val = parseFloat(document.getElementById('weightInput').value);
  if (!val || !currentUser) return;
  await sb.from('body_weight_logs').insert({ user_id: currentUser.id, weight: val, logged_at: todayStr() });
  document.getElementById('weightInput').value = '';
  loadWeight();
});

/* ---------- water ---------- */
async function loadWater() {
  const { data, error } = await sb.from('water_logs')
    .select('id, amount_ml, created_at')
    .eq('logged_at', todayStr())
    .order('created_at', { ascending: false });
  const list = document.getElementById('waterList');
  const totalEl = document.getElementById('waterTotal');
  if (error) { list.innerHTML = '<div class="empty-hint">Could not load entries.</div>'; return; }
  const total = (data || []).reduce((sum, r) => sum + r.amount_ml, 0);
  totalEl.textContent = total + ' ml';
  if (!data || !data.length) { list.innerHTML = '<div class="empty-hint">Nothing logged today.</div>'; return; }
  list.innerHTML = data.map(row => `
    <div class="mini-row">
      <span class="l">+${row.amount_ml} ml</span>
      <span class="r">${new Date(row.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}<button class="del" data-table="water_logs" data-id="${row.id}">remove</button></span>
    </div>
  `).join('');
  attachDelHandlers(list, loadWater);
}

document.querySelectorAll('.quick-row button[data-ml]').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!currentUser) return;
    await sb.from('water_logs').insert({ user_id: currentUser.id, amount_ml: parseInt(btn.dataset.ml, 10), logged_at: todayStr() });
    loadWater();
  });
});

document.getElementById('waterCustomBtn').addEventListener('click', async () => {
  const val = parseInt(document.getElementById('waterCustomInput').value, 10);
  if (!val || !currentUser) return;
  await sb.from('water_logs').insert({ user_id: currentUser.id, amount_ml: val, logged_at: todayStr() });
  document.getElementById('waterCustomInput').value = '';
  loadWater();
});

/* ---------- PRs ---------- */
const PR_LIFTS = ['Squat', 'Bench Press', 'Deadlift', 'Shoulder Press', 'Barbell Row'];

async function loadPRs() {
  const { data, error } = await sb.from('personal_records').select('exercise_name, weight, unit');
  const existing = {};
  (data || []).forEach(r => { existing[r.exercise_name] = r; });
  const grid = document.getElementById('prGrid');
  grid.innerHTML = PR_LIFTS.map(lift => {
    const rec = existing[lift];
    const val = rec ? rec.weight : '';
    return `
      <div class="pr-item">
        <span class="name">${lift}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <input type="number" step="0.5" class="pr-input" data-lift="${lift}" value="${val}" placeholder="kg">
          <button class="pr-save" data-lift="${lift}" style="background:none;border:none;color:var(--iron);cursor:pointer;font-size:12px;">save</button>
        </span>
      </div>
    `;
  }).join('');
  grid.querySelectorAll('.pr-save').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lift = btn.dataset.lift;
      const input = grid.querySelector(`.pr-input[data-lift="${lift}"]`);
      const val = parseFloat(input.value);
      if (!val || !currentUser) return;
      await sb.from('personal_records').upsert(
        { user_id: currentUser.id, exercise_name: lift, weight: val, achieved_at: todayStr() },
        { onConflict: 'user_id,exercise_name' }
      );
      loadPRs();
    });
  });
}

/* ---------- food ---------- */
async function loadFood() {
  const { data, error } = await sb.from('food_logs')
    .select('id, meal_name, calories, created_at')
    .eq('logged_at', todayStr())
    .order('created_at', { ascending: false });
  const list = document.getElementById('foodList');
  const totalEl = document.getElementById('foodTotal');
  if (error) { list.innerHTML = '<div class="empty-hint">Could not load entries.</div>'; return; }
  const total = (data || []).reduce((sum, r) => sum + r.calories, 0);
  totalEl.textContent = total + ' kcal';
  if (!data || !data.length) { list.innerHTML = '<div class="empty-hint">Nothing logged today.</div>'; return; }
  list.innerHTML = data.map(row => `
    <div class="mini-row">
      <span class="l">${row.meal_name}</span>
      <span class="r">${row.calories} kcal<button class="del" data-table="food_logs" data-id="${row.id}">remove</button></span>
    </div>
  `).join('');
  attachDelHandlers(list, loadFood);
}

document.getElementById('foodAddBtn').addEventListener('click', async () => {
  const name = document.getElementById('foodNameInput').value.trim();
  const cal = parseInt(document.getElementById('foodCalInput').value, 10);
  if (!name || !cal || !currentUser) return;
  await sb.from('food_logs').insert({ user_id: currentUser.id, meal_name: name, calories: cal, logged_at: todayStr() });
  document.getElementById('foodNameInput').value = '';
  document.getElementById('foodCalInput').value = '';
  loadFood();
});

/* ---------- shared delete handler ---------- */
function attachDelHandlers(container, reloadFn) {
  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async () => {
      await sb.from(btn.dataset.table).delete().eq('id', btn.dataset.id);
      reloadFn();
    });
  });
}
</script>
